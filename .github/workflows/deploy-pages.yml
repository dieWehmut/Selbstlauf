name: Deploy WebUI to GitHub Pages

on:
  push:
    branches: [main, feature/continuation-watchdog, feature/continuation-pages]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify responsive WebUI
        run: npm --workspace apps/web run test:browser

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  build:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static demo
        run: npm --workspace apps/web run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_DEMO: 'true'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
