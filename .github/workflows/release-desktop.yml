name: Release desktop installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail before anything is built: a tag that disagrees with the declared version
      # produces an installer named after the package version and attached to the
      # wrong release. That is not hypothetical — v0.2.8 once shipped a
      # Selbstlauf-Setup-0.2.7-x64.exe, built from a commit whose package files still
      # said 0.2.7, because nothing checked.
      - name: Assert the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: tests/Test-VersionConsistency.ps1 -Tag "${{ github.ref_name }}"

      # The release workflow is itself code, and a defect in it wastes a whole build: v0.8.4 failed
      # its package job after every installer had been verified, because the upgrade check called the
      # GitHub API unauthenticated and hit the anonymous rate limit. That is checked here, before
      # anything is built.
      - name: Check the release workflow's own guards
        shell: pwsh
        run: tests/Test-ReleaseWorkflow.ps1

      - name: Build workspaces
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Smoke test the desktop shell
        run: npm --workspace apps/desktop run smoke
        env:
          # The smoke probe and the service it starts must agree on the port.
          WATCHDOG_PORT: '48921'
          SELBSTLAUF_SMOKE_PORT: '48921'

  package:
    needs: test
    runs-on: windows-latest
    env:
      # The release ships unsigned installers; do not look for a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Package the Windows installers
        run: npm --workspace apps/desktop run package:win

      - name: Assert both architectures were packaged
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            $installer = Get-ChildItem -LiteralPath tmp/desktop-dist -Filter "Selbstlauf-Setup-*-$arch.exe"
            if (-not $installer) { throw "no $arch installer was produced" }
          }

      - name: Verify the x64 installer installs a complete, self-owned app
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath tmp/desktop-dist -Filter 'Selbstlauf-Setup-*-x64.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'no x64 installer was produced' }
          scripts/desktop/verify-installer.ps1 -Installer $installer

      # Installing over an existing version is the path a user actually takes, and it
      # is a different code path inside NSIS from a fresh install: a duplicated
      # uninstall entry or a merged-in old payload only appears here. The previous
      # published release is used as the base.
      - name: Verify the x64 installer upgrades an existing install in place
        shell: pwsh
        env:
          # Authenticated, because the anonymous limit is 60 requests per hour per IP and the
          # runners share one. This call is what a release does LAST, so an anonymous 403 here
          # fails a build whose installers were already verified — and it did, on v0.8.4, with
          # "API rate limit exceeded". The token raises the limit to 5000/hour.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -LiteralPath tmp/desktop-dist -Filter 'Selbstlauf-Setup-*-x64.exe' | Select-Object -First 1 -ExpandProperty FullName

          # The most recent release that is not the one being built.
          $headers = @{
            'User-Agent' = 'selbstlauf-ci'
            'Accept' = 'application/vnd.github+json'
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            # Without a token this would be rate-limited; say so rather than failing a verified
            # build over a check that could not run.
            Write-Warning 'no token available; skipping the in-place upgrade check rather than risking a rate-limit failure'
            exit 0
          }
          $headers['Authorization'] = "Bearer $env:GH_TOKEN"

          try {
            $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/${{ github.repository }}/releases?per_page=10' -Headers $headers
          } catch {
            # An API failure says nothing about the installer, which the previous step already
            # verified. Report it and carry on instead of failing the release: a transient 403 or
            # a rate limit is not a defect in the artefact.
            Write-Warning "could not list releases ($($_.Exception.Message)); skipping the in-place upgrade check"
            exit 0
          }

          $previous = $releases |
            Where-Object { $_.tag_name -ne "${{ github.ref_name }}" } |
            Where-Object { $_.assets.name -contains 'Selbstlauf-Setup-' + $_.tag_name.TrimStart('v') + '-x64.exe' } |
            Select-Object -First 1

          if (-not $previous) {
            # Nothing to upgrade from yet (for example the first release). Say so
            # instead of silently reporting a pass for a check that did not run.
            Write-Warning 'no previous release with an x64 installer was found; skipping the in-place upgrade check'
            exit 0
          }

          $asset = $previous.assets | Where-Object { $_.name -like 'Selbstlauf-Setup-*-x64.exe' } | Select-Object -First 1
          $baseInstaller = Join-Path $env:TEMP $asset.name
          Write-Host "upgrading from $($previous.tag_name) ($($asset.name))"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $baseInstaller -UseBasicParsing

          scripts/desktop/verify-installer.ps1 -Installer $installer -UpgradeFrom $baseInstaller

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: selbstlauf-desktop-installers
          path: tmp/desktop-dist/Selbstlauf-Setup-*.exe
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tmp/desktop-dist/Selbstlauf-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
