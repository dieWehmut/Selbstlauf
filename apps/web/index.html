<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Continuation Watchdog</title>
    <!--
      Sets the saved theme (and the saved palette's background) before the bundle runs, so the window
      does not open in the dark colours and then correct itself. A file rather than an inline block
      because the service sends `script-src 'self'`; see apps/web/public/theme-boot.js.
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
